[package]
name = "linesweeper"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Joe Neeman <joe@neeman.me>"]
repository = "https://github.com/jneem/linesweeper"
description = "Robust sweep-line algorithm with Kaleiform cooperative computation limits"

[workspace]

[features]
arbitrary = ["dep:arbitrary"]
debug-svg = ["dep:svg"]
generators = []
slow-asserts = []

[dependencies]
arrayvec = { version = "0.7.6", features = ["serde"] }
kurbo = { version = "0.13.0", features = ["serde"] }
polycool = "0.4.0"
rustc-hash = "2.1.1"
smallvec = "1.15.1"
arbitrary = { version = "1.4.1", features = ["derive"], optional = true }
svg = { version = "0.18", default-features = false, optional = true }
