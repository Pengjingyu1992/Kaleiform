[package]
name = "vectorcraft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Kaleiform command line: MCP server (stdio) and headless batch runs"

[[bin]]
name = "vectorcraft-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
vectorcraft-color = { workspace = true }
vectorcraft-doc = { workspace = true }
vectorcraft-engine = { workspace = true }
vectorcraft-format = { workspace = true }
vectorcraft-geom = { workspace = true }
vectorcraft-svg = { workspace = true }
vectorcraft-mcp = { workspace = true }
vectorcraft-render = { workspace = true }
vectorcraft-text = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

# DirectWrite's system font collection (the desktop app's src/system_fonts.rs, shared): fonts that
# font services such as Adobe Fonts load in place (#579). MIT OR Apache-2.0.
[target.'cfg(all(windows, not(target_vendor = "win7")))'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_DirectWrite"] }

[dev-dependencies]
vectorcraft-testkit = { workspace = true }
serde_json = { workspace = true }
