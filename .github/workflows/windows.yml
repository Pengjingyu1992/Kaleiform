name: Windows x64 packages
run-name: Diagnose capture failure with original timing and thread power demand

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    name: Native capture diagnosis (${{ matrix.mode }})
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, awake]
    env:
      VECTORCRAFT_NO_PREFS: "1"
      WGPU_BACKEND: dx12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: kaleiform-windows-x64
          run-id: 41274900560
          github-token: ${{ github.token }}
          path: dist/release
      - name: Validate exact unchanged source packages
        run: ./packaging/windows/verify.ps1 -Phase Validate
      - name: Install the owned test application
        run: ./packaging/windows/verify.ps1 -Phase Install
      - name: Diagnose the first capture failure without changing initial test timing
        timeout-minutes: 14
        run: |
          python -B packaging/windows/diagnose_capture.py --bin-dir "$env:ProgramFiles\Kaleiform" --output dist/windows-qa/diagnosis --mode ${{ matrix.mode }}
          if ($LASTEXITCODE -ne 0) { throw 'The native diagnostic recorded a failure; see its summary' }
      - name: Uninstall this test installation
        if: always()
        run: |
          if (Test-Path dist/windows-qa/installed.sha256) {
            ./packaging/windows/verify.ps1 -Phase Uninstall
          }
      - name: Retain newly generated synthetic diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaleiform-capture-diagnosis-${{ matrix.mode }}
          path: |
            dist/windows-qa/diagnosis/**/*.png
            dist/windows-qa/diagnosis/**/*.json
            dist/windows-qa/diagnosis/**/*.log
          if-no-files-found: ignore
