name: Windows DXGI handle probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handle:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check owned swap-chain handle lifetime
        run: python -B packaging/windows/dxgi_handle_probe.py
