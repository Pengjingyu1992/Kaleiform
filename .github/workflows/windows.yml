name: Windows DXGI frame permit probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signal:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Measure frame permits across owned swap-chain resize
        run: python -B packaging/windows/dxgi_signal_probe.py

  latency:
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      VECTORCRAFT_NO_PREFS: '1'
      WGPU_BACKEND: dx12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable package provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, subprocess
          repository = os.environ['GITHUB_REPOSITORY']
          assert repository == 'Pengjingyu1992/Kaleiform'
          base = f'repos/{repository}/actions/runs/41321138732'
          run = json.loads(subprocess.check_output(['gh', 'api', base]))
          assert run['head_repository']['full_name'] == repository
          assert run['name'] == 'Windows x64 packages' and run['event'] == 'push' and run['head_branch'] == 'main'
          assert run['head_sha'] == '80980e33e91973b82424d28fb400283c4103b3df'
          jobs = json.loads(subprocess.check_output(['gh', 'api', base + '/jobs']))['jobs']
          assert next(j for j in jobs if j['name'] == 'Build and audit x64 packages')['conclusion'] == 'success'
      - uses: actions/download-artifact@v4
        with:
          name: kaleiform-windows-x64
          run-id: 41321138732
          github-token: ${{ github.token }}
          path: dist/release
      - name: Validate and install the owned application
        run: |
          ./packaging/windows/verify.ps1 -Phase Validate
          ./packaging/windows/verify.ps1 -Phase Install
          ./packaging/windows/verify.ps1 -Phase InstalledCli
      - name: Measure original RPC latency with unchanged acceptance limits
        timeout-minutes: 12
        run: python -B packaging/windows/control_latency_probe.py --bin-dir "$env:ProgramFiles\Kaleiform" --output dist/windows-qa/latency
      - name: Report the fresh latency measurements
        if: always()
        shell: python
        run: |
          import json, pathlib
          path = pathlib.Path('dist/windows-qa/latency/control-latency.json')
          if path.exists():
              data = json.loads(path.read_text())
              data['byMethod'] = dict(sorted(data['byMethod'].items(), key=lambda item: item[1]['totalSeconds'], reverse=True)[:8])
              print('::warning::Fresh native RPC latency: ' + json.dumps(data))
          else:
              print('::warning::The native process did not retain latency metrics before termination')
          path = pathlib.Path('dist/windows-qa/latency/functional-results.json')
          if path.exists():
              rows = json.loads(path.read_text(encoding='utf-8'))
              print('::notice::Fresh original matrix progress: ' + json.dumps({'completed': len(rows), 'failed': sum(r['status'] != 'pass' for r in rows)}))
      - name: Uninstall the owned test application
        if: always()
        run: |
          if (Test-Path dist/windows-qa/installed.sha256) {
            ./packaging/windows/verify.ps1 -Phase Uninstall
          }
      - name: Retain fresh synthetic measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaleiform-fresh-native-latency
          path: |
            dist/windows-qa/latency/**/*.json
            dist/windows-qa/latency/**/*.log
            dist/windows-qa/latency/**/*.png
          if-no-files-found: ignore
