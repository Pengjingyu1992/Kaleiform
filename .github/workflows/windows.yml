name: Windows x64 packages
run-name: Isolate installed screenshot failure before and after visual scaling

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  capture:
    name: Installed screenshot probe (${{ matrix.mode }})
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [basic, visual]
    env:
      VECTORCRAFT_NO_PREFS: "1"
      WGPU_BACKEND: dx12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: kaleiform-windows-x64
          run-id: 41268273377
          github-token: ${{ github.token }}
          path: dist/release
      - name: Verify unchanged source packages
        run: ./packaging/windows/verify.ps1 -Phase Validate
      - name: Install the owned test application
        run: ./packaging/windows/verify.ps1 -Phase Install
      - name: Reproduce basic, six visual captures and first panel capture
        timeout-minutes: 6
        run: |
          python -B packaging/windows/diagnose_capture.py --bin-dir "$env:ProgramFiles\Kaleiform" --output dist/windows-qa/probe --mode ${{ matrix.mode }}
          if ($LASTEXITCODE -ne 0) { throw 'Owned-window screenshot probe failed' }
      - name: Uninstall this test installation
        if: always()
        run: |
          if (Test-Path dist/windows-qa/installed.sha256) {
            ./packaging/windows/verify.ps1 -Phase Uninstall
          }
      - name: Retain newly generated synthetic diagnostic captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaleiform-windows-capture-probe-${{ matrix.mode }}
          path: |
            dist/windows-qa/probe/**/*.png
            dist/windows-qa/probe/**/*.json
            dist/windows-qa/probe/**/*.log
          if-no-files-found: ignore
