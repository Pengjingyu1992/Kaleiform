name: Linux packages

on:
  push:
    branches: [main]
    paths: ["apps/**", "crates/**", "Cargo.*", "packaging/**", ".github/workflows/linux.yml"]
  pull_request:
    paths: ["apps/**", "crates/**", "Cargo.*", "packaging/**", ".github/workflows/linux.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ubuntu-22.04
    env:
      NFPM_VERSION: 2.47.0
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Build and desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            desktop-file-utils appstream python3 xvfb xauth mesa-vulkan-drivers libvulkan1 \
            fonts-noto-cjk dbus-x11 xdg-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verified packaging tool
        run: |
          mkdir -p "$RUNNER_TEMP/linux-tools"
          cd "$RUNNER_TEMP/linux-tools"
          archive="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 -o "$archive" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/$archive"
          curl --fail --location --proto '=https' --tlsv1.2 -o checksums.txt \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/checksums.txt"
          grep "  $archive$" checksums.txt > selected.sha256
          sha256sum --check selected.sha256
          tar -xzf "$archive" nfpm
          echo "$RUNNER_TEMP/linux-tools" >> "$GITHUB_PATH"
      - name: Build deb, rpm and portable archive
        run: |
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=."
          packaging/linux/package.sh --formats "deb rpm tar"
          cd dist/release
          sha256sum --check ./*.sha256
      - name: Install and exercise the deb in a minimal runtime
        run: |
          # The runner's development libraries could mask missing package dependencies.
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" ubuntu:22.04 bash -c '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends python3 xvfb xauth mesa-vulkan-drivers \
              libvulkan1 fonts-noto-cjk desktop-file-utils xdg-utils libfile-mimeinfo-perl
            apt-get install -y --no-install-recommends /workspace/dist/release/*.deb
            desktop-file-validate /usr/share/applications/ai.storyteller.vectorcraft.desktop
            VECTORCRAFT_NO_PREFS=1 LIBGL_ALWAYS_SOFTWARE=1 WGPU_BACKEND=vulkan \
              xvfb-run -a python3 /workspace/packaging/linux/smoke.py --desktop --output /tmp/linux-smoke
            test "$(xdg-mime query filetype /tmp/linux-smoke/smoke.vectorcraft)" = application/x-vectorcraft
            apt-get remove -y vectorcraft
            test ! -e /usr/bin/vectorcraft
          '
      - name: Exercise the portable archive
        run: |
          mkdir -p "$RUNNER_TEMP/portable"
          tar -xzf dist/release/*.tar.gz -C "$RUNNER_TEMP/portable" --strip-components=1
          python3 packaging/linux/smoke.py --prefix "$RUNNER_TEMP/portable"
      - uses: actions/upload-artifact@v4
        with:
          name: kaleiform-linux-x86_64
          path: dist/release/*
          if-no-files-found: error
